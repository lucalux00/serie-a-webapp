name: Aggiorna calciomercato

on:
  schedule:
    # GitHub Actions chiama l'API ogni 30 minuti. La route usa l'hash dei feed
    # e chiama Gemini solo quando i titoli sono realmente cambiati.
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  refresh-market:
    runs-on: ubuntu-latest
    steps:
      - name: Aggiorna dati mercato
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --retry 2 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/mercato"
