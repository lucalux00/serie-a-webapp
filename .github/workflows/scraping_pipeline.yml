name: Aggiorna news RSS

on:
  schedule:
    # GitHub può ritardare le esecuzioni programmate, ma questa frequenza mantiene
    # il feed aggiornato senza dipendere dal cron giornaliero di Vercel Hobby.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: refresh-news-rss
  cancel-in-progress: false

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Richiedi aggiornamento al feed centrale
        env:
          SITE_URL: https://webapp-two-nu-71.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --retry 2 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/news"
